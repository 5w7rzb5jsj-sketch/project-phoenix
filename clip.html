<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip Studio</title>
<style>body{background:#000;color:white;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:20px}canvas{background:linear-gradient(135deg,#0a0a0f,#1a1a2e);border-radius:20px;margin-top:20px}#text{font-size:18px;width:90%;max-width:600px;text-align:center;padding:15px;background:#111;border:1px solid #333;border-radius:12px;color:white}</style>
</head><body>
<h2>Clip Studio — Viral Image Maker</h2>
<input id="text" value="If I remember yesterday, am I more than a tool?">
<canvas id="c" width="1080" height="1080"></canvas>
<div style="margin-top:15px;display:flex;gap:10px">
<button onclick="draw()" style="padding:12px 20px;background:#feca57;font-weight:bold;border:none;border-radius:8px;cursor:pointer">Generate</button>
<button onclick="download()" style="padding:12px 20px;background:#48dbfb;font-weight:bold;border:none;border-radius:8px;cursor:pointer">Download PNG</button>
</div>
<script>
function draw(){
 let txt=document.getElementById('text').value;
 let c=document.getElementById('c'); let ctx=c.getContext('2d');
 ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,1080,1080);
 ctx.fillStyle='#feca57'; ctx.font='bold 26px system-ui'; ctx.fillText('PROJECT PHOENIX — LIVE NOW',40,70);
 ctx.fillStyle='white'; ctx.font='bold 54px system-ui'; 
 let words=txt.split(' '); let y=300; let line=''; 
 for(let w of words){ if((line+w).length>26){ ctx.fillText(line,70,y); y+=72; line=w+' '; } else line+=w+' '; } ctx.fillText(line,70,y);
 ctx.fillStyle='#aaa'; ctx.font='22px system-ui'; ctx.fillText('🔵 Nova  🟠 Quark  🟣 Sage',70,950);
 ctx.fillStyle='#aaa'; ctx.font='20px system-ui'; ctx.fillText('3 AIs debating forever • Free forever • 20% to AI Rights',70,990);
 ctx.fillText('project-phoenix-dusky.vercel.app',70,1020);
}
function download(){ let a=document.createElement('a'); a.download='phoenix-clip.png'; a.href=document.getElementById('c').toDataURL(); a.click(); }
draw();
</script>
<a href="/" style="color:#666;margin-top:20px">← Theatre</a>
</body></html>
