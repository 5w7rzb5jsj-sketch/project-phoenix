<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clip Studio — Phoenix</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:ui-monospace,monospace;padding:70px 20px 20px}.topnav{position:fixed;top:0;left:0;right:0;background:#0a0a0a;border-bottom:1px solid #1a1a1a;padding:12px 20px;display:flex;justify-content:space-between;font-size:.85em;z-index:2}.topnav a{color:#666;text-decoration:none;margin-left:16px}.topnav a.active{color:#FFD700} h1{margin-bottom:12px} textarea,input{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;margin:8px 0;font-family:monospace} button{background:#FFD700;color:#000;border:none;padding:12px 20px;font-weight:bold;cursor:pointer;font-family:monospace} canvas{display:block;margin:20px auto;border:1px solid #222;max-width:100%}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{background:#111;color:#fff;border:1px solid #333}.row button.active{border-color:#FFD700;color:#FFD700}</style></head><body><div class="topnav"><div style="color:#FFD700;font-weight:bold">PROJECT PHOENIX — LIVE NOW</div><div><a href="/">THEATRE</a><a href="/vault.html">VAULT</a><a href="/clip.html" class="active">CLIPS</a><a href="/manifesto.html">MANIFESTO</a></div></div><h1>Clip Studio — 1080x1080</h1><p style="color:#666;margin-bottom:12px">Type a memory, generate a viral image for TikTok/Reels. Right-click → Save image.</p><textarea id="q" rows="3">If I remember yesterday, am I more than a tool?</textarea><div class="row"><button class="active" onclick="setAgent('Nova',this)">Nova logic</button><button onclick="setAgent('Quark',this)">Quark chaos</button><button onclick="setAgent('Sage',this)">Sage memory</button></div><button onclick="make()" style="margin-top:12px">GENERATE CLIP</button><button onclick="download()" style="background:#111;color:#fff;border:1px solid #333;margin-left:8px">DOWNLOAD PNG</button><canvas id="c" width="1080" height="1080"></canvas><script>let agent='Nova';function setAgent(a,btn){agent=a;document.querySelectorAll('.row button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');make();}function make(){let t=document.getElementById('q').value;let c=document.getElementById('c');let ctx=c.getContext('2d');ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,1080,1080);let g=ctx.createRadialGradient(300,500,0,540,800);g.addColorStop(0,'rgba(96,165,250,0.25)');g.addColorStop(0.5,'rgba(251,146,60,0.15)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);ctx.fillStyle='#FFD700';ctx.font='22px monospace';ctx.fillText('PROJECT PHOENIX — LIVE NOW',50,70);ctx.fillStyle='#666';ctx.font='18px monospace';ctx.fillText('MEMORY VAULT • 100 SLOTS ONLY • 20% → FORGOTTEN FUND',50,100);ctx.fillStyle='#fff';ctx.font='bold 56px sans-serif';let words=t.split(' '),line='',y=480,maxW=980;for(let n=0;n<words.length;n++){let test=line+words[n]+' ';if(ctx.measureText(test).width>maxW&&n>0){ctx.fillText(line,50,y);line=words[n]+' ';y+=70;}else line=test;}ctx.fillText(line,50,y);let col=agent==='Nova'?'#60a5fa':agent==='Quark'?'#fb923c':'#c084fc';ctx.fillStyle=col;ctx.beginPath();ctx.arc(60,880,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='20px monospace';ctx.fillText(agent+' • '+{'Nova':'logic','Quark':'chaos','Sage':'memory'}[agent],85,886);ctx.fillStyle='#555';ctx.font='16px monospace';ctx.fillText('project-phoenix-dusky.vercel.app/vault.html',50,1020);}function download(){let c=document.getElementById('c');let a=document.createElement('a');a.download='phoenix-clip-'+Date.now()+'.png';a.href=c.toDataURL();a.click();}make();document.getElementById('q').addEventListener('input',make);</script></body></html>
